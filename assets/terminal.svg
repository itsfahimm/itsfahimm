<svg width="780" height="260" viewBox="0 0 780 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="termBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2E93"/>
      <stop offset="50%" stop-color="#7928CA"/>
      <stop offset="100%" stop-color="#00DFD8"/>
    </linearGradient>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E131F"/>
      <stop offset="100%" stop-color="#141927"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .t-title { font-family: 'Fira Code', 'Courier New', monospace; font-size: 12px; fill: #6B7280; }
    .t-prompt { font-family: 'Fira Code', 'Courier New', monospace; font-size: 13px; font-weight: 600; fill: #00DFD8; }
    .t-path { font-family: 'Fira Code', 'Courier New', monospace; font-size: 13px; fill: #A78BFA; }
    .t-cmd { font-family: 'Fira Code', 'Courier New', monospace; font-size: 13px; fill: #F3F4F6; }
    .t-key { font-family: 'Fira Code', 'Courier New', monospace; font-size: 12px; fill: #FF2E93; }
    .t-str { font-family: 'Fira Code', 'Courier New', monospace; font-size: 12px; fill: #34D399; }
    .t-val { font-family: 'Fira Code', 'Courier New', monospace; font-size: 12px; fill: #FBBF24; }
    .t-comment { font-family: 'Fira Code', 'Courier New', monospace; font-size: 12px; fill: #60A5FA; font-style: italic; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    .cursor { animation: blink 1s infinite; fill: #00DFD8; }
  </style>

  <!-- Border Card with Neon Gradient -->
  <rect x="2" y="2" width="776" height="256" rx="14" fill="url(#termBorder)" opacity="0.8"/>
  <rect x="4" y="4" width="772" height="252" rx="12" fill="url(#termBg)"/>

  <!-- Terminal Header Bar -->
  <rect x="4" y="4" width="772" height="36" rx="12" fill="#181F32"/>
  <rect x="4" y="32" width="772" height="8" fill="#181F32"/>
  
  <!-- Window Controls -->
  <circle cx="24" cy="22" r="6" fill="#EF4444"/>
  <circle cx="44" cy="22" r="6" fill="#F59E0B"/>
  <circle cx="64" cy="22" r="6" fill="#10B981"/>

  <text x="390" y="26" text-anchor="middle" class="t-title">fahim@hyperdrive:~ (zsh)</text>

  <!-- Terminal Content Line 1 -->
  <text x="24" y="65" class="t-prompt">fahim@dev<tspan class="t-path">:~$</tspan> <tspan class="t-cmd">whoami --craft</tspan></text>
  
  <!-- Output Line 1 -->
  <text x="24" y="88" class="t-comment">// Digital Craftsman &amp; Polyglot Software Architect</text>

  <!-- Terminal Content Line 2 -->
  <text x="24" y="115" class="t-prompt">fahim@dev<tspan class="t-path">:~$</tspan> <tspan class="t-cmd">cat runtime.config</tspan></text>

  <!-- Output Config Block -->
  <text x="36" y="138" class="t-key">crafts<tspan fill="#9CA3AF">:</tspan> <tspan class="t-str">["Mobile Apps", "Real-Time Games", "Full-Stack Web", "Extensions", "Automation Tools"]</tspan></text>
  <text x="36" y="160" class="t-key">passions<tspan fill="#9CA3AF">:</tspan> <tspan class="t-str">["Clean Architecture", "High Performance", "Funky UI/UX", "Open Source"]</tspan></text>
  <text x="36" y="182" class="t-key">coffee_level<tspan fill="#9CA3AF">:</tspan> <tspan class="t-val">100%</tspan>  <tspan class="t-key">status<tspan fill="#9CA3AF">:</tspan></tspan> <tspan class="t-str">"Building cool stuff that people actually love to use"</tspan></text>
  
  <!-- Terminal Prompt Line 3 with blinking cursor -->
  <text x="24" y="218" class="t-prompt">fahim@dev<tspan class="t-path">:~$</tspan> <tspan class="t-cmd">launch_innovation --speed=maximum</tspan></text>
  <rect x="365" y="206" width="8" height="15" class="cursor"/>
</svg>
